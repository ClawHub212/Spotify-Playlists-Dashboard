<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="playlists-page" data-page-id="playlists">
    <div class="app-container">
      <!-- Current Track Header -->
      <header class="current-track">
        <img
          id="album-cover"
          class="album-cover"
          src=""
          alt="Album Cover"
          style="display: none"
        />
        <div class="track-info">
          <h1 class="track-title" id="track-title">Loading...</h1>
          <div class="artist-row">
            <h2 class="artist-name" id="artist-name">Loading...</h2>
          </div>
        </div>
        <div class="page-identifier">PLAYLISTS</div>
        <button id="sidebar-auto-toggle" class="sidebar-auto-toggle" type="button" aria-pressed="true" aria-label="Auto-reveal sidebar">
          <svg id="sidebar-auto-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        </button>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme">
          <svg id="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        </button>
        <img id="repeat-icon" class="repeat-icon" src="images/Playlists/repeat-green.png" alt="Toggle Repeat" style="display: none" />
        <div class="visualizer">
          <!-- Waveform bars generated dynamically by JS -->
          <div
            id="nothing-playing"
            class="nothing-playing"
            style="display: none"
          >
            Nothing Playing...
          </div>
        </div>
      </header>

      <!-- Playlist Grid -->
      <main class="playlist-section">
        <div class="grid-header">
          <!-- Live name filter: narrows the grid as you type (F / ⌘F focuses it) -->
          <div class="grid-filter" id="grid-filter">
            <svg class="grid-filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input
              id="grid-filter-input"
              class="grid-filter-input"
              type="text"
              placeholder="FILTER PLAYLISTS"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              aria-label="Filter playlists by name"
            />
            <span id="grid-filter-count" class="grid-filter-count" hidden></span>
            <button id="grid-filter-clear" class="grid-filter-clear" type="button" aria-label="Clear filter" hidden>✕</button>
            <kbd class="btn-key" id="key-hint-find">F</kbd>
          </div>
          <button id="add-playlist-btn" class="grid-header-btn" type="button">
            <span class="btn-label">＋ NEW</span><kbd class="btn-key" id="key-hint-new">N</kbd>
          </button>
          <button id="edit-mode-btn" class="grid-header-btn" type="button">
            <span class="btn-label">✎ EDIT</span><kbd class="btn-key" id="key-hint-edit">E</kbd>
          </button>
          <!-- Only rendered while a mode is armed — Esc triggers it too -->
          <button id="cancel-mode-btn" class="grid-header-btn cancel" type="button" hidden>
            <span class="btn-label">✕ CANCEL</span><kbd class="btn-key" id="key-hint-cancel">C</kbd>
          </button>
          <button id="spotify-mode-btn" class="grid-header-btn" type="button">
            <span class="btn-label"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.586 14.424a.622.622 0 0 1-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.622.622 0 1 1-.277-1.215c3.809-.87 7.077-.496 9.712 1.115.293.18.386.563.207.857zm1.223-2.723a.78.78 0 0 1-1.072.257c-2.687-1.652-6.785-2.131-9.965-1.166A.779.779 0 1 1 6.32 11.3c3.632-1.102 8.147-.568 11.234 1.328a.78.78 0 0 1 .255 1.073zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71a.935.935 0 1 1-.543-1.79c3.532-1.072 9.404-.865 13.115 1.338a.936.936 0 0 1-.955 1.608z"/></svg> SPOTIFY</span><kbd class="btn-key" id="key-hint-spotify">S</kbd>
          </button>
          <button id="shortcuts-btn" class="grid-header-btn icon-only" type="button" aria-label="Open Settings" title="Settings — shortcuts, appearance">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6"></path></svg>
          </button>
        </div>
        <div id="mode-banner" class="mode-banner" hidden></div>
        <div class="playlist-grid" id="playlist-grid">
          <!-- Playlist Items will be injected here by JS -->
        </div>
      </main>

      <!-- Artist Release Sidebar -->
      <aside id="artist-sidebar" class="artist-sidebar" aria-label="Artist Latest Release">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <div class="sidebar-content" id="sidebar-content">
          <div class="sidebar-artwork-wrap">
            <img id="sidebar-artwork" class="sidebar-artwork" src="" alt="Album/EP Artwork" />
            <div class="sidebar-release-badge" id="sidebar-release-badge">ALBUM</div>
          </div>
          <div class="sidebar-meta">
            <h3 class="sidebar-release-name" id="sidebar-release-name">—</h3>
            <p class="sidebar-artist-name" id="sidebar-artist-name">—</p>
            <span class="sidebar-release-date" id="sidebar-release-date">—</span>
          </div>
          <div class="sidebar-actions">
            <button id="sidebar-follow-btn" class="sidebar-action-btn follow-btn" aria-label="Follow artist">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
              </svg>
              <span id="follow-btn-text">Follow</span>
            </button>
            <button id="sidebar-library-btn" class="sidebar-action-btn library-btn" aria-label="Add to library">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
              </svg>
              <span id="library-btn-text">Save to Library</span>
            </button>
          </div>
          <div class="sidebar-queue-section">
            <div class="sidebar-queue-label">ADD TO QUEUE</div>
            <div class="sidebar-queue-list" id="sidebar-queue-list">
              <!-- Queue playlists injected by JS -->
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Playlist Editor Modal -->
    <div id="playlist-editor-overlay" class="editor-overlay" hidden>
      <div class="editor-modal" role="dialog" aria-modal="true" aria-labelledby="editor-title">
        <h3 class="editor-title" id="editor-title">NEW PLAYLIST</h3>

        <label class="editor-label" for="editor-display-name">DISPLAY NAME</label>
        <input
          id="editor-display-name"
          class="editor-input"
          type="text"
          placeholder="Name shown on this page"
          autocomplete="off"
          spellcheck="false"
        />

        <label class="editor-label" for="editor-spotify-search">SPOTIFY PLAYLIST TO UPDATE</label>
        <input
          id="editor-spotify-search"
          class="editor-input"
          type="text"
          placeholder="Search your Spotify playlists…"
          autocomplete="off"
          spellcheck="false"
        />
        <div id="editor-spotify-list" class="editor-spotify-list"></div>
        <div id="editor-selected" class="editor-selected" hidden></div>

        <div id="editor-error" class="editor-error" hidden></div>

        <div class="editor-actions">
          <button id="editor-cancel" class="editor-btn ghost" type="button">CANCEL</button>
          <button id="editor-save" class="editor-btn primary" type="button">SAVE</button>
        </div>
      </div>
    </div>

    <script src="grid-shortcuts.js"></script>
    <script src="script.js"></script>
  </body>
</html>
