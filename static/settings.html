<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body class="settings-page">
    <!--
      One Settings surface for the whole app. Hosted by the native Settings
      window (⌘, opens · ⌘` toggles · ⌃G / ⌃A / ⌃S jump to a section) and
      openable as a plain browser tab at /settings. Sections, cards and rows
      are built by settings.js from a declarative model so the search field
      can see every setting.
    -->
    <div class="settings-shell">
      <aside class="settings-rail">
        <div class="rail-brand">SETTINGS</div>
        <label class="rail-search" for="settings-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input
            id="settings-search"
            type="text"
            placeholder="Search settings…"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Search settings"
          />
        </label>
        <nav class="rail-nav" id="rail-nav" aria-label="Settings sections"></nav>
        <div class="rail-foot" id="rail-foot"></div>
      </aside>

      <main class="settings-main">
        <header class="pane-header">
          <div class="pane-heading">
            <h1 class="pane-title" id="pane-title">GENERAL</h1>
            <p class="pane-desc" id="pane-desc"></p>
          </div>
          <button id="pane-close" class="pane-close" type="button" aria-label="Close Settings" title="Close (Esc)">✕</button>
        </header>
        <div class="pane-body" id="pane-body"></div>
      </main>
    </div>

    <script src="grid-shortcuts.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
