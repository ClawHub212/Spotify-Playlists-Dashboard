<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="queue-page" data-page-id="queue">
    <div class="app-container">
      <!-- Current Track Header -->
      <header class="current-track queue-header">
        <img id="album-cover" class="album-cover" src="" alt="Album Cover" style="display: none" />
        <div class="track-info">
          <div class="np-eyebrow"><span class="np-dot"></span>CURRENT ALBUM</div>
          <h1 class="album-name" id="album-name">Loading...</h1>
          <div class="album-meta" id="album-meta"></div>
        </div>
        <div class="page-identifier">QUEUE</div>
        <button id="sidebar-auto-toggle" class="sidebar-auto-toggle" type="button" aria-pressed="true" aria-label="Auto-reveal sidebar">
          <svg id="sidebar-auto-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        </button>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme">
          <svg id="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        </button>
        <img id="repeat-icon" class="repeat-icon" src="images/Queue/repeat-orange.png" alt="Toggle Repeat" style="display: none" />
        <div class="visualizer">
          <!-- Waveform bars generated dynamically by JS -->
          <div
            id="nothing-playing"
            class="nothing-playing"
            style="display: none"
          >
            Nothing Playing...
          </div>
        </div>
      </header>

      <!-- Playlist Grid -->
      <main class="playlist-section">
        <div class="grid-header"></div>
        <div class="playlist-grid" id="playlist-grid">
          <!-- Playlist Items will be injected here by JS -->
        </div>
      </main>

      <!-- Album Sidebar — the current album's tracklist, with the playing
           track lit. Shares the artist sidebar's shell, ids, and CSS. -->
      <aside id="artist-sidebar" class="artist-sidebar album-sidebar" aria-label="Current Album">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <div class="sidebar-content" id="sidebar-content">
          <div class="sidebar-album-head">
            <div class="sidebar-artwork-wrap">
              <img id="sidebar-artwork" class="sidebar-artwork" src="" alt="Album Artwork" />
              <div class="sidebar-release-badge" id="sidebar-release-badge">ALBUM</div>
            </div>
            <div class="sidebar-meta">
              <h3 class="sidebar-release-name" id="sidebar-release-name">—</h3>
              <p class="sidebar-artist-name" id="sidebar-artist-name">—</p>
              <span class="sidebar-release-date" id="sidebar-release-date">—</span>
            </div>
          </div>
          <div class="sidebar-actions">
            <button id="sidebar-library-btn" class="sidebar-action-btn library-btn" aria-label="Add to library">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
              </svg>
              <span id="library-btn-text">Save to Library</span>
            </button>
          </div>
          <div class="sidebar-tracklist-section">
            <div class="sidebar-queue-label sidebar-tracklist-label">
              <span>#</span><span>Title</span><span class="sidebar-tracklist-label-dur">Time</span>
            </div>
            <div class="sidebar-tracklist" id="sidebar-tracklist" role="list">
              <!-- Album tracks injected by JS -->
            </div>
          </div>
        </div>
      </aside>
    </div>

    <script src="grid-shortcuts.js"></script>
    <script src="script.js"></script>
  </body>
</html>
