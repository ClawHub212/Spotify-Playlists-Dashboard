<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Playlists · V2 Families</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────
   V2 · FAMILIES — Neo-Noir Tech
   The slash in "Late Night/Cali" becomes structure: one frosted
   card per family, its children inside as short leaf names.
   Find the family, then the child — two glances, not sixty-six.
   ───────────────────────────────────────────────────────────── */
:root {
  --bg: #070912;
  --panel: rgba(255, 255, 255, 0.03);
  --panel-2: rgba(255, 255, 255, 0.05);
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.14);
  --ink: 255, 255, 255;
  --text: #edf0fa;
  --text-2: #b4bbd0;
  --text-3: #7a829c;
  --accent: #84ff00;
  --accent-rgb: 132, 255, 0;
  --on-accent: #0b1500;
  --head: #8fd8ff;
  --head-rgb: 143, 216, 255;
  --cyan: #00f3ff;
  --cyan-rgb: 0, 243, 255;
  --violet: #a78bfa;
  --violet-rgb: 167, 139, 250;
  --error: #ff4d6d;
  --spotify: #1ed760;
  --active-top: #78e600;
  --active-bot: #4aaf00;
  --font-display: "Exo 2", "Rajdhani", sans-serif;
  --font-body: "Manrope", "DM Sans", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}
body.theme-light {
  --bg: #eceef5;
  --panel: rgba(255, 255, 255, 0.62);
  --panel-2: rgba(15, 20, 40, 0.05);
  --line: rgba(15, 20, 40, 0.12);
  --line-2: rgba(15, 20, 40, 0.22);
  --ink: 15, 20, 40;
  --text: #171a2b;
  --text-2: #464c66;
  --text-3: #6a7190;
  --accent: #3d7a00;
  --accent-rgb: 61, 122, 0;
  --on-accent: #ffffff;
  --head: #0b5f8a;
  --head-rgb: 11, 95, 138;
  --cyan: #006d7a;
  --cyan-rgb: 0, 109, 122;
  --violet: #6d28d9;
  --violet-rgb: 109, 40, 217;
  --error: #c9174a;
  --spotify: #0f7a37;
  --active-top: #4f9c00;
  --active-bot: #356900;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { font-size: 17px; }
body {
  height: 100vh; width: 100vw; overflow: hidden;
  background: var(--bg); color: var(--text); font-family: var(--font-body);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 8% 4%, rgba(255, 110, 70, 0.14) 0%, transparent 40%),
    radial-gradient(ellipse at 88% 12%, rgba(var(--violet-rgb), 0.12) 0%, transparent 42%),
    radial-gradient(ellipse at 55% 110%, rgba(var(--head-rgb), 0.08) 0%, transparent 50%);
}
.app { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; }

/* ── Header (frosted chrome) ─────────────────────────────── */
.hud {
  flex: none; height: 100px; display: flex; align-items: center; gap: 18px; padding: 0 24px;
  background: rgba(var(--ink), 0.025); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
  border-bottom: 1px solid var(--line); position: relative;
}
.art { width: 72px; height: 72px; border-radius: 10px; flex: none; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(var(--ink), 0.08); }
.np { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
.eyebrow { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.18em; color: var(--accent); text-transform: uppercase; }
.eyebrow .time { color: var(--text-3); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: npPulse 2.2s ease-in-out infinite; }
@keyframes npPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
.title { font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.sub .artist { font-size: 19px; font-weight: 700; color: var(--text); white-space: nowrap; }
.sub .meta { font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.06em; color: var(--text-2); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub .meta b { color: var(--text); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 5px; }
.sub .meta .liked { color: var(--accent); }
.pages { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 6px; padding: 5px; border: 1px solid var(--line); border-radius: 12px; background: rgba(var(--ink), 0.03); }
.page { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 8px; text-decoration: none; cursor: pointer; font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-2); transition: all 0.2s; }
.page .pd { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 8px var(--pc); }
.page:hover { color: var(--text); background: rgba(var(--ink), 0.05); }
.page.on { color: var(--on-accent); background: var(--accent); box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.35); }
.page.on .pd { background: var(--on-accent); box-shadow: none; }
.page kbd { font-family: var(--font-mono); font-size: 12px; font-weight: 600; opacity: 0.7; letter-spacing: 0; }
.hud-right { flex: none; display: flex; align-items: center; gap: 10px; }
.ibtn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--text-3); cursor: pointer; display: grid; place-items: center; transition: all 0.2s; }
.ibtn svg { width: 62%; height: 62%; }
.ibtn:hover, .ibtn.on { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.4); box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.22); }
.ibtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.viz { display: flex; align-items: flex-end; gap: 3px; height: 40px; margin-left: 10px; padding-left: 14px; border-left: 1px solid var(--line); }
.viz i { display: block; width: 4px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.5); animation: wave var(--d) ease-in-out infinite alternate; height: var(--lo); }
@keyframes wave { from { height: var(--lo); } to { height: var(--hi); } }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: rgba(var(--ink), 0.06); }
.progress span { display: block; height: 100%; width: 37%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

/* ── Toolbar ─────────────────────────────────────────────── */
.deck { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px 24px 16px; }
.toolbar { flex: none; display: flex; align-items: center; gap: 10px; }
.filter { flex: 0 1 460px; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); color: var(--text-3); transition: all 0.15s; }
.filter:focus-within { border-color: rgba(var(--accent-rgb), 0.7); box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.22); color: var(--accent); }
.filter svg { width: 18px; height: 18px; flex: none; }
.filter input { flex: 1 1 auto; min-width: 0; background: transparent; border: 0; outline: 0; font-family: var(--font-body); font-size: 18px; font-weight: 600; color: var(--text); }
.filter input::placeholder { color: var(--text-3); }
.filter .hint { font-family: var(--font-mono); font-size: 13px; color: var(--text-3); white-space: nowrap; }
.filter .hint b { color: var(--text-2); }
.toolbar .spacer { flex: 1 1 auto; }
.summary { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.12em; color: var(--text-2); text-transform: uppercase; margin-right: 8px; }
.summary .n { padding: 2px 8px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.tbtn { display: inline-flex; align-items: center; gap: 10px; padding: 9px 14px; white-space: nowrap; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: 0.14em; color: var(--text-2); cursor: pointer; text-transform: uppercase; transition: all 0.15s; }
.tbtn svg { width: 16px; height: 16px; }
.tbtn:hover { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.6); background: rgba(var(--accent-rgb), 0.08); }
.tbtn.on { color: var(--cyan); border-color: var(--cyan); background: rgba(var(--cyan-rgb), 0.1); box-shadow: 0 0 12px rgba(var(--cyan-rgb), 0.3); }
.tbtn.spot:hover, .tbtn.spot.on { color: var(--spotify); border-color: var(--spotify); background: rgba(29, 185, 84, 0.1); box-shadow: 0 0 12px rgba(29, 185, 84, 0.3); }
.tbtn.cancel:hover { color: var(--error); border-color: var(--error); background: rgba(255, 77, 109, 0.1); }
.tbtn:focus-visible, .filter input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd.key { font-family: var(--font-mono); font-size: 12px; font-weight: 600; line-height: 1; color: var(--text-3); background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line-2); border-radius: 4px; padding: 4px 6px; letter-spacing: 0; }
body.theme-light kbd.key { background: rgba(255, 255, 255, 0.6); }
.tbtn:hover kbd.key, .tbtn.on kbd.key, .filter:focus-within kbd.key { color: inherit; border-color: currentColor; }
@media (max-width: 1560px) { .summary .txt { display: none; } }
.banner { flex: none; font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.12em; padding: 7px 14px; border: 1px dashed; border-radius: 8px; text-transform: uppercase; }
.banner.edit { color: var(--cyan); border-color: rgba(var(--cyan-rgb), 0.5); background: rgba(var(--cyan-rgb), 0.06); }
.banner.spotify { color: var(--spotify); border-color: rgba(29, 185, 84, 0.55); background: rgba(29, 185, 84, 0.07); }

/* ── Family columns ──────────────────────────────────────── */
.wall { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; gap: 14px; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); align-items: start; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card {
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
  box-shadow: inset 0 1px 0 rgba(var(--ink), 0.06), 0 10px 30px rgba(0, 0, 0, 0.25);
  overflow: hidden; animation: enter 0.5s ease-out both; animation-delay: var(--i);
}
body.theme-light .card { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 8px 24px rgba(15, 20, 40, 0.08); }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.card-h {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  height: 46px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(var(--head-rgb), 0.08), rgba(var(--head-rgb), 0.02));
}
.card-h .fam { font-family: var(--font-display); font-size: 15px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 12px rgba(var(--head-rgb), 0.35); }
.card-h .cnt { font-family: var(--font-mono); font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-3); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.card-h .cnt.lit { color: var(--on-accent); background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.5); }
.card.naga .card-h { background: linear-gradient(180deg, rgba(var(--violet-rgb), 0.14), rgba(var(--violet-rgb), 0.03)); }
.card.naga .card-h .fam { color: var(--violet); text-shadow: 0 0 12px rgba(var(--violet-rgb), 0.4); }
.card.naga .card-h .cnt.lit { background: var(--violet); border-color: var(--violet); color: #fff; box-shadow: 0 0 12px rgba(var(--violet-rgb), 0.5); }
.row {
  position: relative; display: flex; align-items: center; gap: 10px; height: var(--rowH, 44px);
  padding: 0 40px 0 16px; border-top: 1px solid var(--line); cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.row:first-of-type { border-top: 0; }
.row .leaf { font-size: 18px; font-weight: 600; line-height: 1.2; color: var(--text); min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; hyphens: none; }
.row .chk { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; opacity: 0; transition: opacity 0.2s; }
.row .chk svg { width: 100%; height: 100%; fill: #fff; filter: drop-shadow(0 1px 2px rgba(0, 40, 0, 0.5)); }
.row:hover { background: rgba(var(--accent-rgb), 0.12); }
.row:hover .leaf { color: var(--accent); }
.card.naga .row:hover { background: rgba(var(--violet-rgb), 0.14); }
.card.naga .row:hover .leaf { color: var(--violet); }
.row.on { --a: var(--accent-rgb); background: linear-gradient(90deg, var(--active-top) 0%, var(--active-bot) 100%); box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.16), 0 0 18px rgba(var(--a), 0.35); animation: breathe 2.4s ease-in-out infinite; }
.row.on .leaf, .row.on:hover .leaf { color: #fff; font-weight: 700; text-shadow: 0 1px 3px rgba(0, 40, 0, 0.45); }
.row.on .chk { opacity: 1; }
.row.on:hover { filter: brightness(1.08); }
.card.naga .row.on { --a: var(--violet-rgb); background: linear-gradient(90deg, #8b5cf6, #6d28d9); }
body.theme-light .card.naga .row.on { background: linear-gradient(90deg, #7c3aed, #5b21b6); }
@keyframes breathe { 0%, 100% { box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.16), 0 0 18px rgba(var(--a), 0.35); } 50% { box-shadow: inset 0 0 24px rgba(255, 255, 255, 0.26), 0 0 28px rgba(var(--a), 0.6); } }
/* Filter: dim non-matches, ring the top match */
.wall.filtering .row:not(.hit) { opacity: 0.16; }
.wall.filtering .card:not(.has) { opacity: 0.35; }
.wall.filtering .row.top { box-shadow: inset 0 0 0 2px var(--accent); }
.row mark { background: rgba(var(--accent-rgb), 0.3); color: inherit; border-radius: 3px; }
.row.on mark { background: rgba(0, 0, 0, 0.3); }
/* Modes */
body.edit-mode .card { border-style: dashed; border-color: rgba(var(--cyan-rgb), 0.4); }
body.edit-mode .row:hover { background: rgba(var(--cyan-rgb), 0.1); }
body.edit-mode .row:hover .leaf { color: var(--cyan); }
body.spotify-mode .card { border-color: rgba(29, 185, 84, 0.45); }
body.spotify-mode .row:hover { background: rgba(29, 185, 84, 0.12); }
body.spotify-mode .row:hover .leaf { color: var(--spotify); }

.side-handle { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 30px; height: 64px; border: 1px solid var(--line); border-right: 0; border-radius: 8px 0 0 8px; background: rgba(var(--ink), 0.05); color: var(--text-3); cursor: pointer; display: grid; place-items: center; }
.side-handle:hover { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.5); }
.side-handle svg { width: 16px; height: 16px; }
/* No prefers-reduced-motion fallback ON PURPOSE: Adrian runs macOS Reduce Motion
   globally but wants his personal apps fully animated (07-29-26). Don't re-add. */
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <img class="art" id="art" alt="Album cover — Run the World" />
    <div class="np">
      <div class="eyebrow"><span class="dot"></span>Now Playing <span class="time">1:12 / 3:12</span></div>
      <h1 class="title">Run the World</h1>
      <div class="sub"><span class="artist">Loe Shimmy, Brent Faiyaz</span><span class="meta">Single · 08-21-26 · <b>E</b> · Popularity 71 · <span class="liked">♥ Liked</span></span></div>
    </div>
    <nav class="pages" aria-label="Pages">
      <a class="page on" href="#" style="--pc:#84ff00"><span class="pd"></span>Playlists<kbd>⌘1</kbd></a>
      <a class="page" href="#" style="--pc:#bc13fe"><span class="pd"></span>Tracker<kbd>⌘2</kbd></a>
      <a class="page" href="#" style="--pc:#ff8c00"><span class="pd"></span>Queue<kbd>⌘3</kbd></a>
    </nav>
    <div class="hud-right">
      <button class="ibtn on" type="button" aria-label="Sidebar auto-reveal" title="Sidebar reveals itself on add — click to stop that"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="ibtn" type="button" id="theme" aria-label="Switch to Daybreak" title="Daybreak (light) — ⌘⇧L"><svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
      <button class="ibtn" type="button" aria-label="Repeat one" title="Repeat this track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
      <div class="viz" id="viz" aria-hidden="true"></div>
    </div>
    <div class="progress"><span></span></div>
  </header>

  <main class="deck">
    <div class="toolbar">
      <label class="filter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="q" type="text" placeholder="Filter playlists or families" autocomplete="off" spellcheck="false" aria-label="Filter playlists by name" />
        <span class="hint"><b>⏎</b> toggles top match</span>
        <kbd class="key">F</kbd>
      </label>
      <span class="spacer"></span>
      <span class="summary" id="summary"></span>
      <button class="tbtn" type="button">＋ New<kbd class="key">N</kbd></button>
      <button class="tbtn" type="button" id="edit">✎ Edit<kbd class="key">E</kbd></button>
      <button class="tbtn cancel" type="button" id="cancel" hidden>✕ Cancel<kbd class="key">C</kbd></button>
      <button class="tbtn spot" type="button" id="spot"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.586 14.424a.622.622 0 0 1-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.622.622 0 1 1-.277-1.215c3.809-.87 7.077-.496 9.712 1.115.293.18.386.563.207.857zm1.223-2.723a.78.78 0 0 1-1.072.257c-2.687-1.652-6.785-2.131-9.965-1.166A.779.779 0 1 1 6.32 11.3c3.632-1.102 8.147-.568 11.234 1.328a.78.78 0 0 1 .255 1.073zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71a.935.935 0 1 1-.543-1.79c3.532-1.072 9.404-.865 13.115 1.338a.936.936 0 0 1-.955 1.608z"/></svg>Spotify<kbd class="key">S</kbd></button>
      <button class="tbtn" type="button" aria-label="Settings" title="Settings — ⌘,"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6"/></svg></button>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="wall" id="wall"></div>
  </main>

  <button class="side-handle" type="button" aria-label="Open artist sidebar" title="Artist's latest release — ⌘S"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
</div>

<script>
// ── Families. Slash prefixes group automatically ("Late Night/Cali" → LATE NIGHT › Cali);
//    the rest are curated here the way a `family` field in config.json would. ──
const FAMILIES = [
  { name: "Late Night", auto: true, items: ["Late Night/UK Drill","Late Night/_","Late Night/420 Ridazzz","Late Night/ALL","Late Night/Cali","Late Night/Granola Backpack","Late Night/LA 🌴☀️","Late Night/Metaverse/_","Late Night/Pack Hour","Late Night/R&B","Late Night/Sexy Drill","Late Night/South","Late Night/Texas 🌵","Late Night/Trappin","Late Night/West Coast"] },
  { name: "Best of 2026", items: ["Best Hip Hop  🏆 Best","Best Hip Hop  🏆 Faves","Best Hip Hop  🏆 Faves & Best","Best Pack Hour 🏆","Best Pop 🏆 Faves","Best R&B 🏆 Best","Best R&B 🏆 Faves","Best R&B 🏆 Faves & Best"], strip: /^Best\s+/ },
  { name: "DX", auto: true, items: ["DX/Pack Hour","DX/Pack Hour/Slow","DX/TikTok in da Metaverse/_","DX/TikTok in da Metaverse/Slow","DX/Trappin","DX/Trappin/Slow"] },
  { name: "Regions", items: ["Cali 🌴","Jersey","Midwest","NYC","Reggae 🇯🇲","UK Drill"] },
  { name: "Club #OBFH", auto: true, items: ["CLUB #OBFH/ Metaverse","CLUB #OBFH/_","CLUB #OBFH/Slow","CLUB #OBFH/Trappin","Club #OBFH/Trappin/Slow"] },
  { name: "R&B & Luv", items: ["BZZZ___R&B","Chickens 🐔","Rains in da Metaverse","Sexy Drill","Thug Luv"] },
  { name: "Production", items: ["Beats  🥁","Interludes","Remix - TO REMIX","Sample Flips","To Sample 💿"] },
  { name: "More", items: ["Adults NSFW","Album Cuts","BIG TUNEZ 💥💣📈","Features","Female","Granola Backpack","Punchlines 🥊","Trappin/Metaverse/Slow","Ultra Combo"] },
  { name: "ViRaL", items: ["ViRaL 🦠","ViRaL 🦠 Trappin","Snap ViRaL"] },
  { name: "NAGA Next Show", naga: true, items: ["NAGA NEXT SHOW ▶️","NAGA NEXT SHOW - PACK"] },
  { name: "Throwback", items: ["2000s Retro Throwback","90s Throwback"] },
];
const ACTIVE = new Set(["Best R&B 🏆 Faves","Late Night/ALL","Chickens 🐔","Thug Luv","BZZZ___R&B"]);
const leafOf = (fam, n) => { if (fam.auto) { const p = n.split("/"); return p.slice(1).join(" / ").trim(); } if (fam.strip) return n.replace(fam.strip, ""); return n; };
const total = FAMILIES.reduce((s, f) => s + f.items.length, 0);

const ART = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><defs><radialGradient id='a' cx='28%' cy='26%' r='85%'><stop offset='0' stop-color='#ff8a4c'/><stop offset='.5' stop-color='#b3186f'/><stop offset='1' stop-color='#140612'/></radialGradient></defs><rect width='200' height='200' fill='url(#a)'/><circle cx='142' cy='66' r='40' fill='none' stroke='#ffd9a0' stroke-width='1.5' opacity='.85'/><circle cx='142' cy='66' r='22' fill='#ffe9c8' opacity='.9'/><path d='M0 152 Q60 112 100 152 T200 152' fill='none' stroke='#ffe0c2' stroke-width='2.5' opacity='.75'/><path d='M0 168 Q60 128 100 168 T200 168' fill='none' stroke='#ffe0c2' stroke-width='1.5' opacity='.45'/><text x='14' y='186' font-family='Helvetica,Arial' font-size='13' font-weight='700' fill='#fff2e8' letter-spacing='3'>RUN THE WORLD</text></svg>`;
document.getElementById("art").src = "data:image/svg+xml;utf8," + encodeURIComponent(ART);
const viz = document.getElementById("viz");
for (let i = 0; i < 22; i++) { const b = document.createElement("i"); b.style.setProperty("--lo", (6 + Math.random() * 10) + "px"); b.style.setProperty("--hi", (18 + Math.random() * 22) + "px"); b.style.setProperty("--d", (0.55 + Math.random() * 0.6).toFixed(2) + "s"); viz.appendChild(b); }

const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
function applyTheme(t) { document.body.classList.toggle("theme-light", t === "light"); document.getElementById("theme-icon").innerHTML = t === "light" ? MOON : SUN; try { localStorage.setItem("mockTheme", t); } catch (e) {} }
let theme = "dark"; try { theme = localStorage.getItem("mockTheme") || "dark"; } catch (e) {}
if (location.hash === "#light") theme = "light"; if (location.hash === "#dark") theme = "dark";
applyTheme(theme);
document.getElementById("theme").onclick = () => applyTheme(document.body.classList.contains("theme-light") ? "dark" : "light");

// ── Build cards, then pack them into columns (shortest column first) so every
//    row is visible with no scrolling; the row height grows to use the space. ──
const wall = document.getElementById("wall");
const cards = FAMILIES.map((f, fi) => {
  const card = document.createElement("section");
  card.className = "card" + (f.naga ? " naga" : "");
  card.style.setProperty("--i", fi * 45 + "ms");
  card.dataset.fam = f.name;
  card.innerHTML = `<div class="card-h"><span class="fam">${f.name}</span><span class="cnt"></span></div>`;
  f.items.forEach((n) => {
    const r = document.createElement("div");
    r.className = "row" + (ACTIVE.has(n) ? " on" : ""); r.dataset.name = n; r.dataset.leaf = leafOf(f, n);
    r.innerHTML = `<span class="leaf">${r.dataset.leaf}</span><span class="chk"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>`;
    r.title = (ACTIVE.has(n) ? "Remove this track from " : "Add this track to ") + n;
    r.onclick = () => { if (ACTIVE.has(n)) ACTIVE.delete(n); else ACTIVE.add(n); r.classList.toggle("on", ACTIVE.has(n)); r.title = (ACTIVE.has(n) ? "Remove this track from " : "Add this track to ") + n; refreshCounts(); };
    card.appendChild(r);
  });
  return { f, card, rows: f.items.length };
});
function refreshCounts() {
  cards.forEach(({ f, card }) => { const lit = f.items.filter((n) => ACTIVE.has(n)).length; const c = card.querySelector(".cnt"); c.textContent = `${lit} / ${f.items.length}`; c.classList.toggle("lit", lit > 0); });
  document.getElementById("summary").innerHTML = `<span class="n">${ACTIVE.size}</span><span class="txt">of ${total} playlists hold this track</span>`;
}
refreshCounts();
function layout() {
  const W = wall.clientWidth, H = wall.clientHeight, GAP = 14, HEAD = 46;
  const cols = Math.max(3, Math.min(6, Math.floor(W / 350)));
  let rowH = 60, plan = null;
  for (; rowH >= 34; rowH -= 2) {
    const heights = Array(cols).fill(0), bins = Array.from({ length: cols }, () => []);
    cards.slice().sort((a, b) => b.rows - a.rows).forEach((c) => { let k = 0; for (let i = 1; i < cols; i++) if (heights[i] < heights[k]) k = i; bins[k].push(c); heights[k] += (heights[k] ? GAP : 0) + HEAD + c.rows * rowH; });
    if (Math.max(...heights) <= H) { plan = bins; break; }
  }
  if (!plan) { plan = Array.from({ length: cols }, () => []); cards.forEach((c, i) => plan[i % cols].push(c)); rowH = 34; }
  wall.style.setProperty("--cols", cols); wall.style.setProperty("--rowH", rowH + "px");
  wall.innerHTML = "";
  plan.forEach((bin) => { const col = document.createElement("div"); col.className = "col"; bin.sort((a, b) => FAMILIES.indexOf(a.f) - FAMILIES.indexOf(b.f)).forEach((c) => col.appendChild(c.card)); wall.appendChild(col); });
}
new ResizeObserver(layout).observe(wall); layout();

// Filter — family names count as matches too ("late" lights the whole Late Night card)
const q = document.getElementById("q");
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function mark(text, terms) { let out = text; terms.forEach((w) => { const i = norm(out).indexOf(w); if (i >= 0) out = out.slice(0, i) + "<mark>" + out.slice(i, i + w.length) + "</mark>" + out.slice(i + w.length); }); return out; }
function applyFilter() {
  const terms = norm(q.value).split(/\s+/).filter(Boolean);
  wall.classList.toggle("filtering", terms.length > 0);
  let top = null;
  cards.forEach(({ f, card }) => {
    let has = false;
    card.querySelectorAll(".row").forEach((r) => {
      const hay = norm(f.name + " " + r.dataset.name);
      const hit = terms.length && terms.every((w) => hay.includes(w));
      r.classList.toggle("hit", !!hit); r.classList.remove("top");
      r.querySelector(".leaf").innerHTML = hit ? mark(r.dataset.leaf, terms) : r.dataset.leaf;
      if (hit) { has = true; if (!top) top = r; }
    });
    card.classList.toggle("has", has);
  });
  if (top) top.classList.add("top");
}
q.addEventListener("input", applyFilter);
q.addEventListener("keydown", (e) => { if (e.key === "Enter") { const top = wall.querySelector(".row.top"); if (top) top.click(); } if (e.key === "Escape") { q.value = ""; applyFilter(); q.blur(); } });

let mode = null; const banner = document.getElementById("banner");
function setMode(m) {
  mode = mode === m ? null : m;
  document.body.classList.toggle("edit-mode", mode === "edit"); document.body.classList.toggle("spotify-mode", mode === "spotify");
  document.getElementById("edit").classList.toggle("on", mode === "edit"); document.getElementById("spot").classList.toggle("on", mode === "spotify");
  document.getElementById("cancel").hidden = !mode; banner.hidden = !mode; banner.className = "banner " + (mode || "");
  banner.textContent = mode === "edit" ? "Edit mode — click a row to rename it, move it to another family, or change its Spotify playlist" : mode === "spotify" ? "Spotify mode — click a row to open that playlist in the Spotify app" : "";
}
document.getElementById("edit").onclick = () => setMode("edit"); document.getElementById("spot").onclick = () => setMode("spotify"); document.getElementById("cancel").onclick = () => setMode(mode);
document.addEventListener("keydown", (e) => {
  if (e.metaKey && e.shiftKey && e.key.toLowerCase() === "l") { e.preventDefault(); document.getElementById("theme").click(); return; }
  if (document.activeElement === q) return;
  if (e.key === "f" || e.key === "/" || (e.metaKey && e.key === "f")) { e.preventDefault(); q.focus(); q.select(); }
  else if (e.key === "e") setMode("edit"); else if (e.key === "s" && !e.metaKey) setMode("spotify");
  else if (e.key === "c" || e.key === "Escape") { if (mode) setMode(mode); }
});

// ── Headless audit hook (?audit): writes layout metrics into <title>; no visible effect ──
if (location.search.includes("audit")) {
  const run = () => {
    const W = innerWidth, H = innerHeight, sel = ".tile, .row, .pill, .card, .chip, .release";
    const els = [...document.querySelectorAll(sel)];
    const esc = [], clip = [];
    els.forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.right > W + 1 || r.bottom > H + 1 || r.left < -1 || r.top < -1) esc.push(el.className + "@" + Math.round(r.right) + "," + Math.round(r.bottom));
      [".leaf", ".name", ".fam"].forEach((s) => { const t = el.querySelector(s); if (t && t.scrollHeight > t.clientHeight + 2) clip.push(t.textContent.trim()); });
      if (el.matches(".pill, .chip") && el.scrollWidth > el.clientWidth + 1) clip.push("W:" + el.textContent.trim());
    });
    const scrollers = [...document.querySelectorAll("*")].filter((e) => { const cs = getComputedStyle(e); return /auto|scroll/.test(cs.overflowY) && e.scrollHeight > e.clientHeight + 1; }).map((e) => e.className || e.tagName);
    document.title = JSON.stringify({ size: [W, H], doc: [document.documentElement.scrollWidth, document.documentElement.scrollHeight], els: els.length, escapes: esc.slice(0, 6), escapeCount: esc.length, clipped: clip.slice(0, 8), clipCount: clip.length, scrollers });
  };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(run, 700));
}
</script>
