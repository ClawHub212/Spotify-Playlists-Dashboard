<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Playlists · V3 Command Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────
   V3 · COMMAND DECK — Void Minimal, keyboard-first
   The prompt owns the keyboard: type, ⏎ toggles the top match,
   1–9 pick a match, ⌘Z undoes. Left: what the track is IN, what
   the artist's history suggests, and a log of what you just did.
   Right: everything you could still add it to.
   ───────────────────────────────────────────────────────────── */
:root {
  --bg: #050508;
  --panel: rgba(255, 255, 255, 0.025);
  --panel-2: rgba(255, 255, 255, 0.05);
  --line: rgba(255, 255, 255, 0.08);
  --line-2: rgba(255, 255, 255, 0.16);
  --ink: 255, 255, 255;
  --text: #eeeef4;
  --text-2: #b0b0c0;
  --text-3: #6f6f84;
  --accent: #84ff00;
  --accent-rgb: 132, 255, 0;
  --on-accent: #0b1500;
  --cyan: #00f3ff;
  --cyan-rgb: 0, 243, 255;
  --violet: #a78bfa;
  --violet-rgb: 167, 139, 250;
  --error: #ff4d6d;
  --spotify: #1ed760;
  --font-display: "Oxanium", "Orbitron", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}
body.theme-light {
  --bg: #eeefe9;
  --panel: rgba(255, 255, 255, 0.6);
  --panel-2: rgba(20, 24, 10, 0.05);
  --line: rgba(20, 24, 10, 0.12);
  --line-2: rgba(20, 24, 10, 0.24);
  --ink: 20, 24, 10;
  --text: #1b1f16;
  --text-2: #484e3e;
  --text-3: #6c735f;
  --accent: #3d7a00;
  --accent-rgb: 61, 122, 0;
  --on-accent: #ffffff;
  --cyan: #006d7a;
  --cyan-rgb: 0, 109, 122;
  --violet: #6d28d9;
  --violet-rgb: 109, 40, 217;
  --error: #c9174a;
  --spotify: #0f7a37;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { font-size: 17px; }
body { height: 100vh; width: 100vw; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-mono); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 4% 0%, rgba(255, 100, 60, 0.12) 0%, transparent 38%), radial-gradient(ellipse at 100% 100%, rgba(var(--accent-rgb), 0.07) 0%, transparent 45%); }
.app { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; }

/* ── Header ───────────────────────────────────────────────── */
.hud { flex: none; height: 84px; display: flex; align-items: center; gap: 16px; padding: 0 22px; border-bottom: 1px solid var(--line); position: relative; }
.art { width: 58px; height: 58px; border-radius: 6px; flex: none; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(var(--ink), 0.08); }
.np { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; }
.eyebrow .time { color: var(--text-3); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: npPulse 2.2s ease-in-out infinite; }
@keyframes npPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
.title { font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { display: flex; align-items: baseline; gap: 12px; min-width: 0; font-size: 15px; }
.sub .artist { color: var(--text); font-weight: 600; white-space: nowrap; font-size: 17px; }
.sub .meta { color: var(--text-2); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.sub .meta b { color: var(--text); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 5px; }
.sub .meta .liked { color: var(--accent); }
.pages { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 26px; }
.page { display: inline-flex; align-items: center; gap: 10px; padding: 10px 2px; text-decoration: none; cursor: pointer; font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-3); border-bottom: 2px solid transparent; transition: all 0.2s; }
.page .pd { width: 7px; height: 7px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 8px var(--pc); opacity: 0.6; }
.page:hover { color: var(--text); }
.page.on { color: var(--accent); border-bottom-color: var(--accent); text-shadow: 0 0 14px rgba(var(--accent-rgb), 0.45); }
.page.on .pd { opacity: 1; }
.page kbd { font-family: var(--font-mono); font-size: 12px; font-weight: 500; opacity: 0.6; letter-spacing: 0; }
.hud-right { flex: none; display: flex; align-items: center; gap: 8px; }
.ibtn { width: 34px; height: 34px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--text-3); cursor: pointer; display: grid; place-items: center; transition: all 0.2s; }
.ibtn svg { width: 62%; height: 62%; }
.ibtn:hover, .ibtn.on { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.4); box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.22); }
.ibtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.viz { display: flex; align-items: flex-end; gap: 3px; height: 36px; margin-left: 8px; padding-left: 14px; border-left: 1px solid var(--line); }
.viz i { display: block; width: 3px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.5); animation: wave var(--d) ease-in-out infinite alternate; height: var(--lo); }
@keyframes wave { from { height: var(--lo); } to { height: var(--hi); } }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: rgba(var(--ink), 0.06); }
.progress span { display: block; height: 100%; width: 37%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

/* ── Prompt ───────────────────────────────────────────────── */
.prompt-row { flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 22px 0; }
.prompt { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 18px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); transition: all 0.15s; }
.prompt .caret { font-size: 26px; font-weight: 700; color: var(--accent); text-shadow: 0 0 14px rgba(var(--accent-rgb), 0.6); line-height: 1; }
.prompt input { flex: 1 1 auto; min-width: 0; background: transparent; border: 0; outline: 0; font-family: var(--font-mono); font-size: 22px; font-weight: 500; color: var(--text); letter-spacing: 0.01em; }
.prompt input::placeholder { color: var(--text-3); }
.prompt:focus-within { border-color: rgba(var(--cyan-rgb), 0.7); box-shadow: 0 0 0 1px rgba(var(--cyan-rgb), 0.3), 0 0 22px rgba(var(--cyan-rgb), 0.18); }
.prompt .hints { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--text-3); white-space: nowrap; }
.prompt .hints span b { color: var(--text-2); font-weight: 600; }
.prompt .count { font-size: 14px; color: var(--cyan); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cmds { flex: none; display: flex; gap: 8px; }
.cmd { display: inline-flex; align-items: center; gap: 10px; height: 60px; padding: 0 16px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-2); cursor: pointer; transition: all 0.15s; }
.cmd svg { width: 16px; height: 16px; }
.cmd:hover { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.6); background: rgba(var(--accent-rgb), 0.08); }
.cmd.on { color: var(--cyan); border-color: var(--cyan); background: rgba(var(--cyan-rgb), 0.1); box-shadow: 0 0 12px rgba(var(--cyan-rgb), 0.3); }
.cmd.spot:hover, .cmd.spot.on { color: var(--spotify); border-color: var(--spotify); background: rgba(29, 185, 84, 0.1); box-shadow: 0 0 12px rgba(29, 185, 84, 0.3); }
.cmd.cancel:hover { color: var(--error); border-color: var(--error); background: rgba(255, 77, 109, 0.1); }
.cmd:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd.key { font-family: var(--font-mono); font-size: 12px; font-weight: 600; line-height: 1; color: var(--text-3); background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line-2); border-radius: 4px; padding: 4px 6px; letter-spacing: 0; white-space: nowrap; }
body.theme-light kbd.key { background: rgba(255, 255, 255, 0.6); }
.cmd:hover kbd.key, .cmd.on kbd.key { color: inherit; border-color: currentColor; }
.banner { flex: none; margin: 10px 22px 0; font-size: 14px; letter-spacing: 0.12em; padding: 7px 14px; border: 1px dashed; border-radius: 8px; text-transform: uppercase; }
.banner.edit { color: var(--cyan); border-color: rgba(var(--cyan-rgb), 0.5); background: rgba(var(--cyan-rgb), 0.06); }
.banner.spotify { color: var(--spotify); border-color: rgba(29, 185, 84, 0.55); background: rgba(29, 185, 84, 0.07); }

/* ── Deck ─────────────────────────────────────────────────── */
.deck { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 400px 1fr; gap: 0; padding: 14px 22px 16px; }
.pane { min-height: 0; display: flex; flex-direction: column; }
.left { padding-right: 22px; border-right: 1px solid var(--line); gap: 18px; overflow-y: auto; }
.right { padding-left: 22px; gap: 10px; }
.sec-h { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-3); }
.sec-h .n { color: var(--accent); font-size: 14px; }
.sec-h .k { color: var(--text-3); font-weight: 400; letter-spacing: 0.04em; text-transform: none; }
.block { display: flex; flex-direction: column; gap: 8px; flex: none; } /* blocks never compress — the pane scrolls instead */
.block.grow { flex: none; margin-top: auto; }
.list { display: flex; flex-direction: column; gap: 6px; }
::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(var(--ink), 0.14); border-radius: 3px; }

/* rows shared by every list */
.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 12px 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; transition: background 0.15s, border-color 0.15s, box-shadow 0.15s; }
.row .name { flex: 1 1 auto; min-width: 0; font-size: 18px; font-weight: 500; color: var(--text); line-height: 1.25; overflow-wrap: anywhere; }
.row .name .fam { color: var(--text-3); font-weight: 400; }
.row .name mark { background: rgba(var(--accent-rgb), 0.3); color: inherit; border-radius: 3px; box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.35); }
.row .side { flex: none; font-size: 13px; color: var(--text-3); white-space: nowrap; }
.row:hover { border-color: rgba(var(--accent-rgb), 0.7); background: rgba(var(--accent-rgb), 0.1); }
.row.naga { box-shadow: inset 3px 0 0 rgba(var(--violet-rgb), 0.75); }
.row.naga:hover { border-color: var(--violet); background: rgba(var(--violet-rgb), 0.12); }
/* IN list — lit */
.row.on { --a: var(--accent-rgb); background: linear-gradient(90deg, rgba(var(--a), 0.22), rgba(var(--a), 0.08)); border-color: rgba(var(--a), 0.7); box-shadow: 0 0 16px rgba(var(--a), 0.18); }
.row.on .name { font-weight: 700; }
.row.on .name .fam { color: var(--text-2); }
.row.on .chk { flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: rgb(var(--a)); box-shadow: 0 0 12px rgba(var(--a), 0.6); }
.row.on .chk svg { width: 16px; height: 16px; fill: var(--on-accent); }
.row.on.naga { --a: var(--violet-rgb); box-shadow: 0 0 16px rgba(var(--a), 0.18); }
.row.on.naga .chk svg { fill: #fff; }
.row.on .x { flex: none; font-size: 13px; color: var(--text-3); opacity: 0; transition: opacity 0.15s; }
.row.on:hover { border-color: var(--error); background: rgba(255, 77, 109, 0.1); box-shadow: none; }
.row.on:hover .x { opacity: 1; color: var(--error); }
.row.flash { animation: flash 0.6s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 2px var(--accent), 0 0 30px rgba(var(--accent-rgb), 0.8); } 100% { box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.18); } }
/* suggestions */
.row.sug .side { color: var(--text-2); }
.row.sug .add { flex: none; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; color: var(--accent); border: 1px solid rgba(var(--accent-rgb), 0.5); border-radius: 6px; padding: 5px 9px; }
.row.sug:hover .add { background: var(--accent); color: var(--on-accent); }
/* results grid */
.results { flex: 1 1 auto; min-height: 0; display: grid; grid-auto-flow: column; gap: 6px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows, 21), minmax(40px, 1fr)); overflow-y: auto; }
.results .row { min-height: 0; padding: 4px 12px 4px 10px; }
.results .row .name { font-size: 17px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.results.compact .row .name { -webkit-line-clamp: 1; font-size: 16px; }
.results .row .num { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; border: 1px solid var(--line-2); font-size: 12px; font-weight: 600; color: var(--text-3); background: rgba(0, 0, 0, 0.25); }
body.theme-light .results .row .num { background: rgba(255, 255, 255, 0.6); }
.results .row .num:empty { border-color: transparent; background: transparent; }
.results .row.top { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 18px rgba(var(--cyan-rgb), 0.3); }
.results .row.top .num, .results .row.pick .num { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.results .row .plus { flex: none; width: 22px; height: 22px; color: var(--text-3); opacity: 0.6; }
.results .row:hover .plus { color: var(--accent); opacity: 1; }
.results .empty { grid-column: 1 / -1; align-self: center; text-align: center; font-size: 17px; color: var(--text-2); padding: 30px; }
/* log */
.log { display: flex; flex-direction: column; gap: 4px; }
.log .e { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-2); padding: 6px 10px; border-radius: 6px; border: 1px solid transparent; }
.log .e .t { color: var(--text-3); font-variant-numeric: tabular-nums; }
.log .e .op { width: 18px; text-align: center; font-weight: 700; }
.log .e.add .op { color: var(--accent); } .log .e.rem .op { color: var(--error); }
.log .e .who { flex: 1 1 auto; min-width: 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log .e.latest { border-color: var(--line); background: var(--panel); }
.undo { flex: none; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--text-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 3px 7px; cursor: pointer; background: transparent; font-family: var(--font-mono); }
.undo:hover { color: var(--error); border-color: var(--error); }
.undo:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* modes */
body.edit-mode .results .row { border-style: dashed; border-color: rgba(var(--cyan-rgb), 0.4); }
body.spotify-mode .results .row { border-color: rgba(29, 185, 84, 0.45); }
/* No prefers-reduced-motion fallback ON PURPOSE: Adrian runs macOS Reduce Motion
   globally but wants his personal apps fully animated (07-29-26). Don't re-add. */
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <img class="art" id="art" alt="Album cover — Run the World" />
    <div class="np">
      <div class="eyebrow"><span class="dot"></span>Now Playing <span class="time">1:12 / 3:12</span></div>
      <h1 class="title">Run the World</h1>
      <div class="sub"><span class="artist">Loe Shimmy, Brent Faiyaz</span><span class="meta">Single · 08-21-26 · <b>E</b> · Popularity 71 · <span class="liked">♥ Liked</span></span></div>
    </div>
    <nav class="pages" aria-label="Pages">
      <a class="page on" href="#" style="--pc:#84ff00"><span class="pd"></span>Playlists<kbd>⌘1</kbd></a>
      <a class="page" href="#" style="--pc:#bc13fe"><span class="pd"></span>Tracker<kbd>⌘2</kbd></a>
      <a class="page" href="#" style="--pc:#ff8c00"><span class="pd"></span>Queue<kbd>⌘3</kbd></a>
    </nav>
    <div class="hud-right">
      <button class="ibtn on" type="button" aria-label="Sidebar auto-reveal" title="Sidebar reveals itself on add — click to stop that"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="ibtn" type="button" id="theme" aria-label="Switch to Daybreak" title="Daybreak (light) — ⌘⇧L"><svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
      <button class="ibtn" type="button" aria-label="Repeat one" title="Repeat this track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
      <div class="viz" id="viz" aria-hidden="true"></div>
    </div>
    <div class="progress"><span></span></div>
  </header>

  <div class="prompt-row">
    <label class="prompt">
      <span class="caret">›</span>
      <input id="q" type="text" placeholder="type a playlist…" autocomplete="off" spellcheck="false" aria-label="Type a playlist name; Enter toggles the top match" autofocus />
      <span class="count" id="count"></span>
      <span class="hints"><span><b>⏎</b> toggle top match</span><span><b>1–9</b> pick a match</span><span><b>⌘Z</b> undo</span><span><b>esc</b> clear</span></span>
    </label>
    <div class="cmds">
      <button class="cmd" type="button">＋ New<kbd class="key">⌥N</kbd></button>
      <button class="cmd" type="button" id="edit">✎ Edit<kbd class="key">⌥E</kbd></button>
      <button class="cmd cancel" type="button" id="cancel" hidden>✕ Cancel<kbd class="key">esc</kbd></button>
      <button class="cmd spot" type="button" id="spot"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.586 14.424a.622.622 0 0 1-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.622.622 0 1 1-.277-1.215c3.809-.87 7.077-.496 9.712 1.115.293.18.386.563.207.857zm1.223-2.723a.78.78 0 0 1-1.072.257c-2.687-1.652-6.785-2.131-9.965-1.166A.779.779 0 1 1 6.32 11.3c3.632-1.102 8.147-.568 11.234 1.328a.78.78 0 0 1 .255 1.073zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71a.935.935 0 1 1-.543-1.79c3.532-1.072 9.404-.865 13.115 1.338a.936.936 0 0 1-.955 1.608z"/></svg>Spotify<kbd class="key">⌥S</kbd></button>
      <button class="cmd" type="button" aria-label="Settings" title="Settings — ⌘,"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6"/></svg></button>
    </div>
  </div>
  <div class="banner" id="banner" hidden></div>

  <main class="deck">
    <section class="pane left">
      <div class="block">
        <div class="sec-h"><span>In this track <span class="n" id="in-n">5</span></span><span class="k">click a row to remove</span></div>
        <div class="list" id="in-list"></div>
      </div>
      <div class="block">
        <div class="sec-h"><span>From artist history</span><span class="k">where Brent Faiyaz already lives</span></div>
        <div class="list" id="sug-list"></div>
      </div>
      <div class="block grow" style="justify-content:flex-end">
        <div class="sec-h"><span>Last actions</span><span class="k">this session</span></div>
        <div class="log" id="log"></div>
      </div>
    </section>
    <section class="pane right">
      <div class="sec-h"><span>Add to <span class="n" id="out-n">61</span></span><span class="k" id="out-k">A → Z · type to narrow</span></div>
      <div class="results" id="results"></div>
    </section>
  </main>
</div>

<script>
const NAMES = ["Adults NSFW","Album Cuts","Beats  🥁","Best Hip Hop  🏆 Best","Best Hip Hop  🏆 Faves","Best Hip Hop  🏆 Faves & Best","Best Pack Hour 🏆","Best Pop 🏆 Faves","Best R&B 🏆 Best","Best R&B 🏆 Faves","Best R&B 🏆 Faves & Best","BIG TUNEZ 💥💣📈","BZZZ___R&B","Cali 🌴","Chickens 🐔","CLUB #OBFH/ Metaverse","CLUB #OBFH/_","CLUB #OBFH/Slow","CLUB #OBFH/Trappin","Club #OBFH/Trappin/Slow","DX/Pack Hour","DX/Pack Hour/Slow","DX/TikTok in da Metaverse/_","DX/TikTok in da Metaverse/Slow","DX/Trappin","DX/Trappin/Slow","Features","Female","Granola Backpack","Interludes","Jersey","Late Night/UK Drill","Late Night/_","Late Night/420 Ridazzz","Late Night/ALL","Late Night/Cali","Late Night/Granola Backpack","Late Night/LA 🌴☀️","Late Night/Metaverse/_","Late Night/Pack Hour","Late Night/R&B","Late Night/Sexy Drill","Late Night/South","Late Night/Texas 🌵","Late Night/Trappin","Late Night/West Coast","Midwest","NAGA NEXT SHOW ▶️","NAGA NEXT SHOW - PACK","NYC","Punchlines 🥊","Rains in da Metaverse","Reggae 🇯🇲","Remix - TO REMIX","Sample Flips","Sexy Drill","Snap ViRaL","Thug Luv","Trappin/Metaverse/Slow","UK Drill","Ultra Combo","ViRaL 🦠","ViRaL 🦠 Trappin","2000s Retro Throwback","90s Throwback","To Sample 💿"];
const ACTIVE = new Set(["Best R&B 🏆 Faves","Late Night/ALL","Chickens 🐔","Thug Luv","BZZZ___R&B"]);
// Artist history: playlists that already hold other tracks by this artist (backend would derive it from the cache)
const SUGGEST = [["Best R&B 🏆 Best", 6], ["Late Night/R&B", 4], ["Rains in da Metaverse", 3]];
const LOG = [{ t: "10:41:07", op: "+", who: "Late Night/ALL" }, { t: "10:40:52", op: "+", who: "Thug Luv" }, { t: "10:40:31", op: "−", who: "Cali 🌴" }, { t: "10:39:58", op: "+", who: "Chickens 🐔" }];
const sorted = NAMES.slice().sort((a, b) => a.localeCompare(b));
const isNaga = (n) => n.toUpperCase().includes("NAGA NEXT SHOW");
const fmt = (n, terms) => { const p = n.split("/"); const leaf = p[p.length - 1].trim(); const fam = p.length > 1 ? p.slice(0, -1).join(" / ").trim() + " / " : ""; return (fam ? `<span class="fam">${mark(fam, terms)}</span>` : "") + mark(leaf, terms); };
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function mark(text, terms) { if (!terms || !terms.length) return text; let out = text; terms.forEach((w) => { const i = norm(out).indexOf(w); if (i >= 0) out = out.slice(0, i) + "<mark>" + out.slice(i, i + w.length) + "</mark>" + out.slice(i + w.length); }); return out; }

const ART = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><defs><radialGradient id='a' cx='28%' cy='26%' r='85%'><stop offset='0' stop-color='#ff8a4c'/><stop offset='.5' stop-color='#b3186f'/><stop offset='1' stop-color='#140612'/></radialGradient></defs><rect width='200' height='200' fill='url(#a)'/><circle cx='142' cy='66' r='40' fill='none' stroke='#ffd9a0' stroke-width='1.5' opacity='.85'/><circle cx='142' cy='66' r='22' fill='#ffe9c8' opacity='.9'/><path d='M0 152 Q60 112 100 152 T200 152' fill='none' stroke='#ffe0c2' stroke-width='2.5' opacity='.75'/><path d='M0 168 Q60 128 100 168 T200 168' fill='none' stroke='#ffe0c2' stroke-width='1.5' opacity='.45'/><text x='14' y='186' font-family='Helvetica,Arial' font-size='13' font-weight='700' fill='#fff2e8' letter-spacing='3'>RUN THE WORLD</text></svg>`;
document.getElementById("art").src = "data:image/svg+xml;utf8," + encodeURIComponent(ART);
const viz = document.getElementById("viz");
for (let i = 0; i < 20; i++) { const b = document.createElement("i"); b.style.setProperty("--lo", (5 + Math.random() * 9) + "px"); b.style.setProperty("--hi", (16 + Math.random() * 20) + "px"); b.style.setProperty("--d", (0.55 + Math.random() * 0.6).toFixed(2) + "s"); viz.appendChild(b); }
const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
function applyTheme(t) { document.body.classList.toggle("theme-light", t === "light"); document.getElementById("theme-icon").innerHTML = t === "light" ? MOON : SUN; try { localStorage.setItem("mockTheme", t); } catch (e) {} }
let theme = "dark"; try { theme = localStorage.getItem("mockTheme") || "dark"; } catch (e) {}
if (location.hash.includes("light")) theme = "light"; if (location.hash.includes("dark")) theme = "dark";
applyTheme(theme);
document.getElementById("theme").onclick = () => applyTheme(document.body.classList.contains("theme-light") ? "dark" : "light");

const q = document.getElementById("q");
const CHK = '<span class="chk"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>';
function stamp() { const d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map((x) => String(x).padStart(2, "0")).join(":"); }
function act(name, on, flash) {
  if (on) ACTIVE.add(name); else ACTIVE.delete(name);
  LOG.unshift({ t: stamp(), op: on ? "+" : "−", who: name }); LOG.length = Math.min(LOG.length, 5);
  render(flash ? name : null);
}
function render(flashName) {
  const terms = norm(q.value).split(/\s+/).filter(Boolean);
  // IN
  const inList = document.getElementById("in-list"); inList.innerHTML = "";
  const on = sorted.filter((n) => ACTIVE.has(n));
  document.getElementById("in-n").textContent = on.length;
  if (!on.length) inList.innerHTML = `<div class="row" style="cursor:default;color:var(--text-2)">Not saved anywhere yet — pick a playlist on the right.</div>`;
  on.forEach((n) => { const r = document.createElement("div"); r.className = "row on" + (isNaga(n) ? " naga" : "") + (n === flashName ? " flash" : ""); r.title = "Remove this track from " + n; r.innerHTML = `${CHK}<span class="name">${fmt(n)}</span><span class="x">remove ✕</span>`; r.onclick = () => act(n, false); inList.appendChild(r); });
  // Suggestions
  const sug = document.getElementById("sug-list"); sug.innerHTML = "";
  SUGGEST.filter(([n]) => !ACTIVE.has(n)).forEach(([n, k]) => { const r = document.createElement("div"); r.className = "row sug"; r.title = "Add this track to " + n; r.innerHTML = `<span class="name">${fmt(n)}</span><span class="side">${k} tracks</span><span class="add">+ add</span>`; r.onclick = () => act(n, true, true); sug.appendChild(r); });
  if (!sug.children.length) sug.innerHTML = `<div class="row" style="cursor:default;color:var(--text-2);font-size:15px">Every playlist this artist lives in already has this track.</div>`;
  // Log
  const log = document.getElementById("log"); log.innerHTML = "";
  LOG.forEach((e, i) => { const d = document.createElement("div"); d.className = "e " + (e.op === "+" ? "add" : "rem") + (i === 0 ? " latest" : ""); d.innerHTML = `<span class="t">${e.t}</span><span class="op">${e.op}</span><span class="who">${e.who}</span>` + (i === 0 ? `<button class="undo" type="button" title="Undo this action — ⌘Z">undo ⌘Z</button>` : ""); if (i === 0) d.querySelector(".undo").onclick = undo; log.appendChild(d); });
  // Results
  const res = document.getElementById("results"); res.innerHTML = "";
  const out = sorted.filter((n) => !ACTIVE.has(n)).filter((n) => !terms.length || terms.every((w) => norm(n).includes(w)));
  document.getElementById("out-n").textContent = out.length;
  document.getElementById("out-k").textContent = terms.length ? `${out.length} match${out.length === 1 ? "" : "es"} · 1–9 pick one` : "A → Z · type to narrow";
  document.getElementById("count").textContent = terms.length ? `${out.length} / ${sorted.length - ACTIVE.size}` : "";
  if (!out.length) res.innerHTML = `<div class="empty">Nothing matches “${q.value}” — <b>⏎</b> would create it as a new playlist.</div>`;
  out.forEach((n, i) => { const r = document.createElement("div"); r.className = "row" + (isNaga(n) ? " naga" : "") + (terms.length && i === 0 ? " top" : ""); r.title = "Add this track to " + n; r.innerHTML = `<span class="num">${terms.length && i < 9 ? i + 1 : ""}</span><span class="name">${fmt(n, terms)}</span><svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`; r.onclick = () => act(n, true, true); res.appendChild(r); });
  layout(out.length);
}
function layout(n) {
  const res = document.getElementById("results"); n = n || res.children.length || 1;
  const w = res.clientWidth, h = res.clientHeight;
  const cols = Math.max(2, Math.min(5, Math.floor(w / 330)));
  const rows = Math.max(1, Math.ceil(n / cols));
  res.style.setProperty("--cols", cols); res.style.setProperty("--rows", rows);
  res.classList.toggle("compact", (h - (rows - 1) * 6) / rows < 48);
}
function undo() { const e = LOG.shift(); if (!e) return; if (e.op === "+") ACTIVE.delete(e.who); else ACTIVE.add(e.who); render(e.op === "−" ? e.who : null); }
new ResizeObserver(() => layout()).observe(document.getElementById("results"));
render();
q.focus();

q.addEventListener("input", () => render());
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const top = document.querySelector(".results .row.top") || document.querySelector(".results .row"); if (top && q.value.trim()) top.click(); q.value = ""; render(); }
  else if (/^[1-9]$/.test(e.key) && q.value.trim()) { e.preventDefault(); const rows = document.querySelectorAll(".results .row"); const r = rows[Number(e.key) - 1]; if (r) { r.click(); q.value = ""; render(); } }
  else if (e.key === "Escape") { if (q.value) { q.value = ""; render(); } else if (mode) setMode(mode); }
});
let mode = null; const banner = document.getElementById("banner");
function setMode(m) {
  mode = mode === m ? null : m;
  document.body.classList.toggle("edit-mode", mode === "edit"); document.body.classList.toggle("spotify-mode", mode === "spotify");
  document.getElementById("edit").classList.toggle("on", mode === "edit"); document.getElementById("spot").classList.toggle("on", mode === "spotify");
  document.getElementById("cancel").hidden = !mode; banner.hidden = !mode; banner.className = "banner " + (mode || "");
  banner.textContent = mode === "edit" ? "Edit mode — ⏎ or a click opens the playlist for renaming instead of toggling it" : mode === "spotify" ? "Spotify mode — ⏎ or a click opens that playlist in the Spotify app" : "";
  q.focus();
}
document.getElementById("edit").onclick = () => setMode("edit"); document.getElementById("spot").onclick = () => setMode("spotify"); document.getElementById("cancel").onclick = () => setMode(mode);
document.addEventListener("keydown", (e) => {
  if (e.metaKey && e.shiftKey && e.key.toLowerCase() === "l") { e.preventDefault(); document.getElementById("theme").click(); return; }
  if (e.metaKey && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); return; }
  if (e.altKey && e.code === "KeyE") { e.preventDefault(); setMode("edit"); return; }
  if (e.altKey && e.code === "KeyS") { e.preventDefault(); setMode("spotify"); return; }
  if (document.activeElement !== q && e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey) { q.focus(); }
});

// ── Headless audit hook (?audit): writes layout metrics into <title>; no visible effect ──
if (location.search.includes("audit")) {
  const run = () => {
    const W = innerWidth, H = innerHeight, sel = ".tile, .row, .pill, .card, .chip, .release";
    const els = [...document.querySelectorAll(sel)];
    const esc = [], clip = [];
    els.forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.right > W + 1 || r.bottom > H + 1 || r.left < -1 || r.top < -1) esc.push(el.className + "@" + Math.round(r.right) + "," + Math.round(r.bottom));
      [".leaf", ".name", ".fam"].forEach((s) => { const t = el.querySelector(s); if (t && t.scrollHeight > t.clientHeight + 2) clip.push(t.textContent.trim()); });
      if (el.matches(".pill, .chip") && el.scrollWidth > el.clientWidth + 1) clip.push("W:" + el.textContent.trim());
    });
    const scrollers = [...document.querySelectorAll("*")].filter((e) => { const cs = getComputedStyle(e); return /auto|scroll/.test(cs.overflowY) && e.scrollHeight > e.clientHeight + 1; }).map((e) => e.className || e.tagName);
    document.title = JSON.stringify({ size: [W, H], doc: [document.documentElement.scrollWidth, document.documentElement.scrollHeight], els: els.length, escapes: esc.slice(0, 6), escapeCount: esc.length, clipped: clip.slice(0, 8), clipCount: clip.length, scrollers });
  };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(run, 700));
}
</script>
